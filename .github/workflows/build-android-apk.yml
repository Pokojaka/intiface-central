name: Build Android APK

on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Add Android Rust targets
        run: rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build APK
        run: |
          set -euo pipefail

          flutter pub get
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64

      - name: Verify native libs present
        run: ./scripts/verify-android-native-libs.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intiface-central-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
